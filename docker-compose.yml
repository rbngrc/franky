services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    image: vegapunk:latest
    build:
      context: ../vegapunk
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/franky
      SPRING_DATASOURCE_USERNAME: franky
      SPRING_DATASOURCE_PASSWORD: franky
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: franky
      POSTGRES_USER: franky
      POSTGRES_PASSWORD: franky
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
